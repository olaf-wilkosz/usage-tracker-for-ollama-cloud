name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks and builds, it never writes to the repository
permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Type check (tsc --checkJs on extension/)
        run: npm run typecheck
      - name: Release checks (versions, store limits, permissions, forbidden patterns)
        run: npm run check
      - name: Accessibility audit (axe-core in the runner's Chrome)
        run: npm run a11y
      - name: Build the website and score it with Lighthouse (a11y, best practices, SEO = 100; performance median of 3 >= 90)
        run: |
          npm run site
          npm run lighthouse
      - name: Build store packages
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error
