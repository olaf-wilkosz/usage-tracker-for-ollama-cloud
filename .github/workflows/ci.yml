name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Release checks (versions, store limits, permissions, forbidden patterns)
        run: npm run check
      - name: Accessibility audit (axe-core in the runner's Chrome)
        run: npm run a11y
      - name: Build store packages
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error
