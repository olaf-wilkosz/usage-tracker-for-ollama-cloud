name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks and builds, it never writes to the repository
permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Type check (tsc --checkJs on extension/)
        run: npm run typecheck
      - name: Release checks (versions, store limits, permissions, forbidden patterns)
        run: npm run check
      - name: Accessibility audit (axe-core in the runner's Chrome)
        run: npm run a11y
      - name: Build the website and score it with Lighthouse (a11y, best practices, SEO = 100; performance median of 3 >= 90)
        run: |
          npm run site
          npm run lighthouse
      - name: Build store packages
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error
