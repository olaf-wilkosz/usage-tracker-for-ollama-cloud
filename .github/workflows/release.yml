name: Release

# Push a tag like v1.2.0 (after bumping the version in extension/manifest.json and
# package.json) to build the packages and publish a GitHub Release with the zips attached.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Accessibility audit
        run: npm run a11y
      - name: Release checks (the tag must match the manifest version)
        run: node scripts/check-release.mjs "${{ github.ref_name }}"
      - run: npm run build
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Usage Tracker for Ollama Cloud ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
