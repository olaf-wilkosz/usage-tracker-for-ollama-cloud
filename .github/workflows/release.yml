name: Release

# Push a tag like v1.2.0 (after bumping the version in extension/manifest.json and
# package.json) to build the packages and publish a GitHub Release with the zips attached.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Accessibility audit
        run: npm run a11y
      - name: Release checks (the tag must match the manifest version)
        run: node scripts/check-release.mjs "${{ github.ref_name }}"
      - run: npm run build
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Usage Tracker for Ollama Cloud ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
