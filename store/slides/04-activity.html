<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Activity</title>
  <link rel="stylesheet" href="slides.css">
</head>
<body>
  <div class="slide">
    <div class="copy">
      <div class="brand"><img src="/ext/icons/icon128.png" alt="">Usage Tracker for Ollama Cloud</div>
      <h1>Spot your <em>busy hours</em> and days.</h1>

      <div class="chips"><span class="chip">Week by hour</span><span class="chip">Month by day</span><span class="chip">Peak / off-peak banner</span></div>
    </div>
    <div class="device"><iframe src="/popup?scenario=busy&click=%23activityMonthBtn&scroll=%23activityBlock" title="Extension popup with sample data"></iframe></div>
    <div class="footnote">Unofficial &middot; not affiliated with Ollama</div>
    <div class="device-note">Sample data</div>
  </div>
